name: build-apk
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q -o *.zip || true; ls -la
      - run: echo "DIR=$(dirname $(find . -name settings.gradle.kts | head -1))" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: 'platforms;android-34 build-tools;34.0.0'}
      - uses: gradle/actions/setup-gradle@v3
        with: {gradle-version: '8.7'}
      - run: gradle assembleRelease --no-daemon --stacktrace
        working-directory: ${{ env.DIR }}
      - uses: actions/upload-artifact@v4
        with:
          name: cxai-free-apk
          path: '**/app/build/outputs/apk/release/*.apk'
          if-no-files-found: error
          retention-days: 30
